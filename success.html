<!DOCTYPE html>
<html>
<head>
<title>DZ Store - Order Receipt</title>

<style>
body{
    margin:0;
    background:linear-gradient(135deg,#10192c,#4b1fb3);
    font-family:Arial,sans-serif;
    color:white;
}

.receipt{
    max-width:420px;
    margin:40px auto;
    background:#1d2c4d;
    padding:25px;
    border-radius:18px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-bottom:5px;
}

.success{
    color:#39ff88;
    text-align:center;
    font-size:20px;
    margin-bottom:20px;
}

.item{
    margin:12px 0;
    font-size:18px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#2f5fff;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
}
</style>

</head>

<body>

<div class="receipt">

<h1>🎮 DZ STORE</h1>

<div class="success">✅ ORDER RECEIPT</div>

<div class="item" id="order"></div>
<div class="item" id="game"></div>
<div class="item" id="uc"></div>
<div class="item" id="price"></div>
<div class="item" id="player"></div>
<div class="item" id="date"></div>
<div class="item">Status : 🟡 Awaiting Payment Confirmation</div>

<button onclick="copyOrder()">📋 Copy Order ID</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const uc = params.get("uc");
const price = params.get("price");
const player = params.get("id");

const orderId = "DZ-" + Date.now();

document.getElementById("order").innerHTML = "<b>Order ID:</b> " + orderId;
document.getElementById("game").innerHTML = "<b>Game:</b> BGMI";
document.getElementById("uc").innerHTML = "<b>UC Package:</b> " + uc;
document.getElementById("price").innerHTML = "<b>Amount:</b> ₹" + price;
document.getElementById("player").innerHTML = "<b>Player ID:</b> " + player;
document.getElementById("date").innerHTML = "<b>Date:</b> " + new Date().toLocaleString();

function copyOrder(){
    navigator.clipboard.writeText(orderId);
    alert("Order ID copied!");
}

</script>

</body>
</html>
