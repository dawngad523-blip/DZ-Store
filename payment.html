<!DOCTYPE html>
<html>
<head>
<title>Payment</title>
<style>
body{
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px;
}
.card{
    background:#1d2c4d;
    padding:20px;
    border-radius:15px;
    max-width:350px;
    margin:auto;
}
button{
    padding:12px 25px;
    background:#2f5fff;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
}
.hero{
    text-align:center;
    padding:40px 20px;
    background:linear-gradient(135deg,#1b2d6b,#5a2fd8);
}

.hero h1{
    margin:0;
    font-size:38px;
}

.hero p{
    margin-top:10px;
    font-size:18px;
    color:#d7d7d7;
}
</style>
</head>
<body>
  <div class="hero">
    <h1>🎮 BGMI Store</h1>
    <p>Fast • Secure • Instant UC Delivery</p>
</div>

<div class="card">
<h2>Payment Details</h2>

<p id="uc"></p>
<p id="price"></p>
<p id="player"></p>

<br>

<button onclick="payNow()">Pay Now</button>

</div>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("uc").innerHTML =
"UC: " + params.get("uc");

document.getElementById("price").innerHTML =
"Price: ₹" + params.get("price");

document.getElementById("player").innerHTML =
"Player ID: " + params.get("id");

function payNow() {
  const amount = params.get("price");

const upi =
"upi://pay?pa=dawngad523@oksbi&pn=DZ%20Store&am=" +
amount +
"&cu=INR";

window.location.href = upi;
}
</script>

</body>
</html>
