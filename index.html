<!DOCTYPE html>
<html>
<head>
<title>DZ Store</title>
<style>
body{
margin:0;
background: linear-gradient(135deg, #0b1f4d, #1a237e, #5b1fa6);
font-family:Arial,sans-serif;
color:white;
}

.header{
background:#162340;
padding:18px;
font-size:26px;
font-weight:bold;
text-align:center;
}

.games{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:15px;
}

.card{
background:#1d2c4d;
padding:20px;
border-radius:12px;
text-align:center;
font-size:18px;
}

.card:hover{
background:#263b66;
}
</style>
</head>

<body>

<div class="header">
🎮 DZ Store
<br><br>

<input
type="text"
placeholder="🔍 Search games..."
style="
width:90%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
background:#24375f;
color:white;
">
</div>

<img src="banner.png"
style="width:100%;border-radius:18px;margin-top:15px;margin-bottom:20px;">

<div class="games">

<a href="bgmi.html" class="card">BGMI</a>

<div class="card">Mobile Legends</div>

<div class="card">PUBG</div>

<div class="card">Free Fire</div>

<div class="card">COD Mobile</div>

<div class="card">Honor of Kings</div>

</div>

</body>
</html>
